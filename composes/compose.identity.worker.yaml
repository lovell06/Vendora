services:
  identity-worker:
    build: 
      context: .
      dockerfile: src/Services/Identity/Worker/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    env_file:
      - ./configs/shared/rabbitmq.env
      - ./configs/identity/rabbitmq.consumer.env
      - ./configs/identity/rabbitmq.consumer.keys.env
      - ./configs/identity/smtp.env
    secrets:
      - source: identity_connection_string
        target: ConnectionStrings__Postgres
    depends_on:
      - postgres
      - rabbitmq

secrets:
  identity_connection_string:
    file: ./secrets/identity-connection-string.txt