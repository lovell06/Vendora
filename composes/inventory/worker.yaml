services:
  inventory-worker:
    build:
      context: .
      dockerfile: src/Services/Inventory/Worker/Dockerfile
    env_file:
      - composes/shared/environments/netcore.env
      - composes/shared/environments/rabbitmq.env
      - composes/inventory/environments/rabbitmq.consumer.env
      - composes/inventory/environments/rabbitmq.consumer.keys.env
    secrets:
      - source: inventory_connection_string
        target: ConnectionStrings__Postgres
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      inventory-api: 
        condition: service_healthy
