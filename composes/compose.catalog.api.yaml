services:  
  catalog-api:
    build: 
      context: .
      dockerfile: src/Services/Catalog/Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    env_file:
      - ./configs/catalog/jwt.env
      - ./configs/catalog/services.env
    ports:
      - 8082:8080
    secrets:
      - jwt_public_key
      - source: catalog_connection_string
        target: ConnectionStrings__Postgres
    depends_on:
      - postgres
      - redis
      - inventory-api

secrets:
  catalog_connection_string:
    file: ./secrets/catalog-connection-string.txt
