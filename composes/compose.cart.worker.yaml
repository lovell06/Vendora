services:
  cart-worker:
    build: 
      context: .
      dockerfile: src/Services/Cart/Worker/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    env_file: 
      - ./configs/shared/rabbitmq.env
      - ./configs/cart/rabbitmq.consumer.env
      - ./configs/cart/rabbitmq.consumer.keys.env
    secrets:
      - source: cart_connection_string
        target: ConnectionStrings__Postgres
    depends_on:
      - postgres
      - redis
      - rabbitmq

secrets:
  cart_connection_string:
    file: ./secrets/cart-connection-string.txt