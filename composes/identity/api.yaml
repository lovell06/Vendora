services:
  identity-api: 
    build: 
      context: .
      dockerfile: src/Services/Identity/Api/Dockerfile 
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    env_file:
      - composes/identity/environments/admin.account.env
      - composes/identity/environments/caching.env
      - composes/identity/environments/jwt.env
    ports:
      - 8081:8080
    secrets:
      - jwt_private_key
      - source: identity_connection_string
        target: ConnectionStrings__Postgres
    depends_on:
      - postgres
      - redis

secrets:
  identity_connection_string:
    file: composes/identity/secrets/connection-string.txt