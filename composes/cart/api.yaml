services:  
  cart-api:
    build: 
      context: .
      dockerfile: src/Services/Cart/Api/Dockerfile
    healthcheck:
      test: curl -sSL http://localhost:8080/health
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    env_file:
      - composes/shared/environments/aspnetcore.env
      - composes/cart/environments/jwt.env
      - composes/cart/environments/services.env
    ports:
      - 8084:8080
    secrets:
      - jwt_public_key
      - source: cart_connection_string
        target: ConnectionStrings__Postgres
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

secrets:
  cart_connection_string:
    file: composes/cart/secrets/connection-string.txt