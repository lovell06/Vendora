services:  
  cart-api:
    build: 
      context: .
      dockerfile: src/Services/Cart/Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    env_file:
      - composes/cart/environments/jwt.env
    ports:
      - 8084:8080
    secrets:
      - jwt_public_key
      - source: cart_connection_string
        target: ConnectionStrings__Postgres
    depends_on:
      - postgres
      - redis

secrets:
  cart_connection_string:
    file: composes/cart/secrets/connection-string.txt