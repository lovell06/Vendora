services:
  cart-worker:
    build: 
      context: .
      dockerfile: src/Services/Cart/Worker/Dockerfile
    env_file: 
      - composes/shared/environments/netcore.env
      - composes/shared/environments/rabbitmq.env
      - composes/cart/environments/rabbitmq.consumer.env
      - composes/cart/environments/rabbitmq.consumer.keys.env
    secrets:
      - source: cart_connection_string
        target: ConnectionStrings__Postgres
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      cart-api: 
        condition: service_healthy

secrets:
  cart_connection_string:
    file: composes/cart/secrets/connection-string.txt