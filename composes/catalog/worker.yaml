services:
  catalog-worker:
    build:
      context: .
      dockerfile: src/Services/Catalog/Worker/Dockerfile
    env_file:
      - composes/shared/environments/netcore.env
      - composes/shared/environments/rabbitmq.env
    secrets:
      - source: catalog_connection_string
        target: ConnectionStrings__Postgres
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog-api:
        condition: service_healthy
