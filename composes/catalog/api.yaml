services:  
  catalog-api:
    build: 
      context: .
      dockerfile: src/Services/Catalog/Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    env_file:
      - composes/catalog/environments/jwt.env
      - composes/catalog/environments/services.env
    ports:
      - 8082:8080
    secrets:
      - jwt_public_key
      - source: catalog_connection_string
        target: ConnectionStrings__Postgres
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

secrets:
  catalog_connection_string:
    file: composes/catalog/secrets/connection-string.txt
